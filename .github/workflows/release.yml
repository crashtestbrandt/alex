name: release

# A `vX.Y.Z` tag on main takes every platform as far as it can go (docs/releases.md):
#
# - A draft GitHub Release with notes from the merged PR titles.
# - Linux, Windows, macOS (notarized) and Android (APK) builds attached to it.
# - The AAB on the Google Play internal and closed testing tracks, once PLAY_SERVICE_ACCOUNT_JSON is set, and
#   on production once Google allows it.
# - The iOS build on TestFlight, then the App Store listing set and the version sent to App Review. An approved
#   version goes live by itself.
#
# A release candidate, `vX.Y.Z-rc.N`, goes to testers only: a GitHub pre-release with every download,
# TestFlight, and Google Play's internal and closed testing tracks. It skips Play production, the Play listing
# and App Review. Each tag has its own build number (docs/releases.md "Build numbers").
#
# The release leaves draft when every job passed. A run by hand (workflow_dispatch) builds, signs and checks
# everything and publishes nothing.
#
# Signing secrets live in the `release` environment, which only main and v* tags can use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      build: ${{ steps.version.outputs.build }}
      candidate: ${{ steps.version.outputs.candidate }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag is the version; project.godot keeps a placeholder. iOS and Google Play take only digits, so a
      # build's version is X.Y.Z. A release candidate, vX.Y.Z-rc.N, builds as X.Y.Z too, and its label names
      # the files and the GitHub release. A run by hand builds as 0.0.0.
      - name: Version
        id: version
        env:
          REQUIRE_CANDIDATE: ${{ vars.REQUIRE_CANDIDATE }}
        run: |
          set -euo pipefail
          version=0.0.0
          label=0.0.0
          candidate=false
          publish=false
          # The build number every store sees: the commit count times 100, plus the candidate's number, or 99
          # for a final. Each tag gets its own, and a final outranks its candidates on the same commit.
          slot=99
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            label="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" != v* || ! "$label" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
              echo "::error::The tag is $GITHUB_REF_NAME. It must be vX.Y.Z or vX.Y.Z-rc.N."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              candidate=true
              slot="${BASH_REMATCH[3]}"
              if (( 10#$slot < 1 || 10#$slot > 98 )); then
                echo "::error::$GITHUB_REF_NAME is candidate $slot. A candidate is numbered 1 to 98."
                exit 1
              fi
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main."
              exit 1
            fi
            # With REQUIRE_CANDIDATE on, a final ships only what testers had: a candidate of the same version
            # on the same commit (docs/releases.md "Release candidates").
            if [[ "$candidate" == "false" && "$REQUIRE_CANDIDATE" == "true" ]] \
              && ! git tag --points-at "$GITHUB_SHA" | grep -qx "v${version//./\\.}-rc\.[0-9]*"; then
              echo "::error::$GITHUB_REF_NAME has no candidate on its commit. Tag v$version-rc.N there first."
              exit 1
            fi
            publish=true
          fi
          build=$(( $(git rev-list --count HEAD) * 100 + 10#$slot ))
          {
            echo "version=$version"
            echo "label=$label"
            echo "build=$build"
            echo "candidate=$candidate"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version ($label), build $build, candidate $candidate, publish $publish"

      # A release candidate is a pre-release, for testers. It never becomes "Latest".
      - name: Draft the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${{ steps.version.outputs.candidate }}" == "true" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes ${prerelease[@]+"${prerelease[@]}"} \
            --title "Alex ${{ steps.version.outputs.label }}"

  desktop:
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: write
    env:
      ALEX_VERSION: ${{ needs.plan.outputs.version }}
      ALEX_LABEL: ${{ needs.plan.outputs.label }}
      ALEX_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: linux_release.x86_64 windows_release_x86_64.exe

      - name: Import
        run: godot --headless --path . --import

      - name: Export
        run: |
          tools/export.sh --export-release Linux build/release/linux/alex.x86_64
          tools/export.sh --export-release "Windows Desktop" build/release/windows/alex.exe

      - name: Check
        run: tools/check-exports.sh build/release

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C build/release/linux -czf "dist/alex-$ALEX_LABEL-linux-x86_64.tar.gz" alex.x86_64 alex.pck
          (cd build/release/windows && zip -q "$GITHUB_WORKSPACE/dist/alex-$ALEX_LABEL-windows-x86_64.zip" alex.exe alex.pck)
          ls -la dist

      - name: Attach
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  android:
    runs-on: ubuntu-latest
    needs: [plan]
    environment: release
    permissions:
      contents: write
    env:
      ALEX_VERSION: ${{ needs.plan.outputs.version }}
      ALEX_LABEL: ${{ needs.plan.outputs.label }}
      ALEX_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: android_release.apk android_source.zip

      - name: Import
        run: godot --headless --path . --import

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Export
        env:
          # The key alias is public. As a secret, GitHub masked every "alex" in the logs.
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: alex
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          tools/export.sh --export-release Android build/release/android/alex.apk
          tools/export.sh --export-release "Google Play" build/release/play/alex.aab

      - name: Check
        run: tools/check-exports.sh build/release

      - name: Attach
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/release/android/alex.apk "build/release/alex-$ALEX_LABEL-android.apk"
          gh release upload "$GITHUB_REF_NAME" "build/release/alex-$ALEX_LABEL-android.apk" --clobber

      # Every tag has its own version code, so a candidate reaches the testing tracks too. A candidate leaves
      # production and the store listing alone; a final sets both.
      - name: Google Play
        if: needs.plan.outputs.publish == 'true'
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACKS: ${{ vars.PLAY_TRACKS }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_KEY" ]]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing went to Google Play."
            exit 0
          fi
          if [[ "$CANDIDATE" == "true" ]]; then
            export PLAY_PRODUCTION=skip PLAY_LISTING=skip
          fi
          printf '%s' "$PLAY_KEY" > "$RUNNER_TEMP/play.json"
          PLAY_SERVICE_ACCOUNT_JSON="$RUNNER_TEMP/play.json" tools/play-upload.sh build/release/play/alex.aab "$ALEX_LABEL"

  macos:
    runs-on: macos-26
    needs: [plan]
    environment: release
    permissions:
      contents: write
    env:
      ALEX_VERSION: ${{ needs.plan.outputs.version }}
      ALEX_LABEL: ${{ needs.plan.outputs.label }}
      ALEX_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: macos.zip

      - name: Import
        run: tools/godot.sh --headless --rendering-driver opengl3 --audio-driver Dummy --path . --import

      - name: Export
        run: tools/export.sh --export-release macOS build/release/macos/alex.zip

      - uses: ./.github/actions/apple-keys
        with:
          asc-key: ${{ secrets.ASC_KEY_P8 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          developer-id-p12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          developer-id-password: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}

      - name: Sign and notarize
        run: tools/notarize-macos.sh build/release

      - name: Check
        run: tools/check-exports.sh build/release

      - name: Attach
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/release/macos/alex.zip "build/release/alex-$ALEX_LABEL-macos.zip"
          gh release upload "$GITHUB_REF_NAME" "build/release/alex-$ALEX_LABEL-macos.zip" --clobber

  ios:
    runs-on: macos-26
    needs: [plan]
    environment: release
    env:
      ALEX_VERSION: ${{ needs.plan.outputs.version }}
      ALEX_LABEL: ${{ needs.plan.outputs.label }}
      ALEX_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: ios.zip

      - name: Import
        run: tools/godot.sh --headless --rendering-driver opengl3 --audio-driver Dummy --path . --import

      - uses: ./.github/actions/apple-keys
        with:
          asc-key: ${{ secrets.ASC_KEY_P8 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      # A run by hand signs the .ipa and uploads nothing.
      - name: TestFlight
        run: |
          if [[ "${{ needs.plan.outputs.publish }}" == "true" ]]; then
            tools/testflight.sh build/release
          else
            tools/testflight.sh build/release --export-only
          fi

      - name: Check
        run: tools/check-exports.sh build/release

  publish:
    runs-on: ubuntu-latest
    needs: [plan, desktop, android, macos, ios]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.plan.outputs.candidate }}" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # The App Store, for the build the ios job uploaded. Apple processes a build for 10 to 30 minutes before it
  # can be submitted, so this waits on its own runner, and the GitHub Release does not wait for it.
  app-store:
    runs-on: ubuntu-latest
    needs: [plan, ios]
    # A release candidate stops at TestFlight.
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.candidate != 'true'
    environment: release
    timeout-minutes: 120
    env:
      ALEX_VERSION: ${{ needs.plan.outputs.version }}
      ALEX_LABEL: ${{ needs.plan.outputs.label }}
      ALEX_BUILD: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - uses: ./.github/actions/apple-keys
        with:
          asc-key: ${{ secrets.ASC_KEY_P8 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Listing and App Review
        env:
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        # The lowest processed build from the commit's first number on: a candidate's, when one shares the commit.
        run: tools/app-store.sh release "$ALEX_VERSION" "$(( $(git rev-list --count HEAD) * 100 ))"
