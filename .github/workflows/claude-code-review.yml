name: Claude PR review

# An automatic Claude Code review when a pull request is opened (not a draft) or a draft is marked ready.
# Needs a repository secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`.

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory; read CLAUDE.md
            first and honor the project's conventions. Focus, in priority order, on:
            - Correctness: bugs, logic errors, unhandled edge cases.
            - Project invariants (flag any violation):
              * Strict GDScript typing: every var/param/return explicitly typed; Array/Dictionary typed;
                no `as`-cast of a Variant without an `is` check (warnings are promoted to errors).
              * Product rules: the child is never tested, scored, timed or rewarded; adult screens sit
                behind a HoldButton; tweens multiply by Style.motion_scale(); tiles honor tile_min_size.
              * Data rules: Profile.SCHEMA_VERSION moves with the on-disk shape; a bad row is skipped,
                never fatal; a family's recordings never enter the repository.
            - Privacy: no network call, no analytics, no AI call reaching the child.

            Be concise and high-signal: only flag issues that genuinely matter; skip nits, style, and praise.
            If the change looks good, say so briefly. Use `gh pr comment` for a short top-level summary and
            `mcp__github_inline_comment__create_inline_comment` (with confirmed: true) for line-level
            findings. Only post GitHub comments; do not return review text as a chat message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(grep:*),Read,Glob,Grep"
