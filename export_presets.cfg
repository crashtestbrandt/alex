; Export presets. docs/exports.md is the authority; tools/check-export-presets.sh enforces the rules below.
;
; Each preset names only the options Alex depends on, and Godot fills every other option with its default.
; The editor rewrites this file with every option and no comments once a preset is changed in the Export
; dialog. The check script holds the rules either way.
;
; - Every preset carries `starters/*.json`, `PRIVACY.md`, `GUIDE.md` and `GLOSSARY.md` in include_filter, so the
;   packs and the pages the profile picker shows ship under any export mode.
; - Android and iOS cover phones and tablets.
; - Android, iOS and macOS declare the microphone. The recording overlay is silent without it.
; - No preset holds a signing secret. Release signing comes from environment variables (docs/exports.md).
; - `Android` and `Google Play` share every option except the Gradle build. `version/code` stays 1 here;
;   tools/export.sh stamps the commit count for the length of an export.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="starters/*.json, PRIVACY.md, GUIDE.md, GLOSSARY.md"
exclude_filter="tests/*, tools/*, docs/*"
export_path="build/android/alex.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
version/code=1
package/unique_name="io.github.crashtestbrandt.alex"
package/app_category=9
package/retain_data_on_uninstall=true
package/show_in_android_tv=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/record_audio=true
permissions/internet=false

